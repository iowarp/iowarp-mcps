name: Publish Python Package

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'mcp-server-versions.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'clio-kit-mcp-servers/**'
      - 'clio-agentic-search/src/**'
      - 'clio-agentic-search/pyproject.toml'
      - 'clio-agentic-search/uv.lock'
      - 'prompts/**'
  push:
    branches:
      - main  # Validate release artifacts on main commits
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'mcp-server-versions.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'clio-kit-mcp-servers/**'
      - 'clio-agentic-search/src/**'
      - 'clio-agentic-search/pyproject.toml'
      - 'clio-agentic-search/uv.lock'
      - 'prompts/**'
    tags:
      - 'v*.*.*'  # Publish releases to PyPI on version tags (paths don't apply to tags)
  workflow_dispatch:  # Allow manual triggering

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Test release surfaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: "0.11.28"
        enable-cache: false
    - name: Use HTTPS for public GitHub dependencies
      shell: bash
      run: |
        git config --global url.https://github.com/.insteadOf git@github.com:
    - name: Verify locks, contracts, tests, lint, and strict types
      shell: bash
      run: |
        uv lock --check
        uv lock --check --directory clio-agentic-search
        uv run --with ruff ruff check scripts src tests
        uv run --with ruff ruff format --check scripts src tests
        uv run --with mypy mypy scripts/generate_server_json.py \
          scripts/generate_mcp_user_contracts.py \
          scripts/extract_mcp_metadata.py scripts/verify_pypi_release.py \
          scripts/release_authorization.py \
          scripts/verify_mcp_registry_release.py src
        uv run pytest -q tests --junitxml="$RUNNER_TEMP/root-junit.xml"
        python scripts/assert_no_skipped_tests.py "$RUNNER_TEMP/root-junit.xml"
        for server in jarvis slurm spack; do
          uv lock --check --directory "clio-kit-mcp-servers/$server"
          uv run --directory "clio-kit-mcp-servers/$server" ruff check .
          uv run --directory "clio-kit-mcp-servers/$server" ruff format --check .
          uv run --directory "clio-kit-mcp-servers/$server" mypy src
          uv run --directory "clio-kit-mcp-servers/$server" pytest -q \
            --junitxml="$RUNNER_TEMP/$server-junit.xml"
          python scripts/assert_no_skipped_tests.py \
            "$RUNNER_TEMP/$server-junit.xml"
          uv run --directory "clio-kit-mcp-servers/$server" pip-audit
        done
        uv run --directory clio-kit-mcp-servers/chronolog \
          ruff check src tests/test_lazy_client.py
        uv run --directory clio-kit-mcp-servers/chronolog \
          ruff format --check src tests/test_lazy_client.py
        uv run --directory clio-kit-mcp-servers/chronolog \
          pytest -q tests/test_lazy_client.py \
          --junitxml="$RUNNER_TEMP/chronolog-junit.xml"
        python scripts/assert_no_skipped_tests.py \
          "$RUNNER_TEMP/chronolog-junit.xml"
        uv lock --check --directory clio-kit-mcp-servers/adios
        uv run --directory clio-kit-mcp-servers/adios \
          ruff check src tests/test_lazy_import.py
        uv run --directory clio-kit-mcp-servers/adios \
          ruff format --check src tests/test_lazy_import.py
        uv run --directory clio-kit-mcp-servers/adios \
          pytest -q tests/test_lazy_import.py tests/test_mcp_handlers.py tests/test_server.py \
          --junitxml="$RUNNER_TEMP/adios-junit.xml"
        python scripts/assert_no_skipped_tests.py \
          "$RUNNER_TEMP/adios-junit.xml"

    - name: Regenerate and verify deterministic publishing manifests
      shell: bash
      run: |
        generation_log="$(mktemp)"
        trap 'rm -f "$generation_log"' EXIT
        uv run python scripts/generate_server_json.py clio-kit-mcp-servers | tee "$generation_log"
        if grep -Eq 'Warning:|Skipped server\.json|^Failed:' "$generation_log"; then
          echo "::error::Every published MCP server must support live metadata extraction"
          exit 1
        fi
        git diff --exit-code -- \
          .claude-plugin/marketplace.json \
          claude_desktop_config.json \
          gemini-extension.json \
          clio-kit-mcp-servers \
          src/clio_kit/_mcp_contracts

    - name: Build every root-wheel server package
      shell: bash
      run: |
        server_dist="$(mktemp -d)"
        trap 'rm -rf "$server_dist"' EXIT
        server_count=0
        for server_dir in clio-kit-mcp-servers/*/; do
          if [ ! -f "$server_dir/pyproject.toml" ]; then
            continue
          fi
          if [ ! -f "$server_dir/server.json" ]; then
            echo "::error::Shipped MCP server is missing server.json: $server_dir"
            exit 1
          fi
          server_name="$(basename "$server_dir")"
          mkdir -p "$server_dist/$server_name"
          uv lock --check --directory "$server_dir"
          uv build --directory "$server_dir" --out-dir "$server_dist/$server_name"
          server_count=$((server_count + 1))
        done
        test "$server_count" -gt 0
        uvx --from 'twine==6.2.0' twine check "$server_dist"/*/*

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Fix the build timestamp to the source commit
      shell: bash
      run: |
        SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
        test -n "$SOURCE_DATE_EPOCH"
        echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: "0.11.28"
        enable-cache: false
    
    - name: Determine version
      id: version
      shell: bash
      run: |
        BASE_VERSION=$(python - <<'PY'
        import tomllib
        from pathlib import Path
        print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
        PY
        )
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          test "$VERSION" = "$BASE_VERSION"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "Building release version: $VERSION"
        else
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=${GITHUB_SHA:0:7}
          VERSION="${BASE_VERSION}.dev${TIMESTAMP}+${SHORT_SHA}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "Building dev version: $VERSION"
        fi
    
    - name: Update version in pyproject.toml
      if: steps.version.outputs.is_release != 'true'
      run: |
        sed -i 's/version = ".*"/version = "${{ steps.version.outputs.version }}"/' pyproject.toml
        echo "Updated pyproject.toml version to: ${{ steps.version.outputs.version }}"
        grep "version =" pyproject.toml
    
    - name: Build package
      run: |
        uv build
        uvx --from 'twine==6.2.0' twine check dist/*

    - name: Smoke installed root wheel and shipped server discovery
      shell: bash
      run: |
        child_cache="$(mktemp -d)"
        tool_dir="$(mktemp -d)"
        tool_bin="$(mktemp -d)"
        trap 'rm -rf "$child_cache" "$tool_dir" "$tool_bin"' EXIT
        export CLIO_KIT_CACHE_DIR="$child_cache"
        export UV_TOOL_DIR="$tool_dir"
        export UV_TOOL_BIN_DIR="$tool_bin"
        mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print | sort)
        test "${#wheels[@]}" -eq 1
        wheel="$(realpath "${wheels[0]}")"
        uv tool install --no-cache "$wheel"
        clio_kit="$tool_bin/clio-kit"
        test -x "$clio_kit"
        "$clio_kit" --help >/dev/null
        listed_servers="$("$clio_kit" mcp-servers)"
        listed_contracts="$("$clio_kit" mcp-contracts)"
        grep -Fq 'clio-kit-jarvis-user-v3' <<< "$listed_contracts"
        grep -Fq 'clio-kit-slurm-user-v3' <<< "$listed_contracts"
        grep -Fq 'clio-kit-spack-user-v2' <<< "$listed_contracts"
        jarvis_contract="$("$clio_kit" \
          mcp-contract clio-kit-jarvis-user-v3)"
        python -c 'import json,sys; value=json.load(sys.stdin); assert value["contract_id"] == "clio-kit-jarvis-user-v3"; assert {tool["name"] for tool in value["tools"]} == {"jarvis_create_pipeline", "jarvis_describe", "jarvis_add_step", "jarvis_edit_step", "jarvis_run", "jarvis_get_execution"}' \
          <<< "$jarvis_contract"
        slurm_contract="$("$clio_kit" \
          mcp-contract clio-kit-slurm-user-v3)"
        python -c 'import json,sys; value=json.load(sys.stdin); assert value["contract_id"] == "clio-kit-slurm-user-v3"' \
          <<< "$slurm_contract"
        spack_contract="$("$clio_kit" \
          mcp-contract clio-kit-spack-user-v2)"
        python -c 'import json,sys; value=json.load(sys.stdin); assert value["contract_id"] == "clio-kit-spack-user-v2"' \
          <<< "$spack_contract"
        server_count=0
        for server_dir in clio-kit-mcp-servers/*/; do
          if [ ! -f "$server_dir/pyproject.toml" ]; then
            continue
          fi
          server_name="$(basename "$server_dir")"
          grep -Fqx -- "  - $server_name" <<< "$listed_servers"
          server_count=$((server_count + 1))
        done
        test "$server_count" -gt 0
        child_help="$("$clio_kit" mcp-server spack -- --help)"
        grep -Fq 'Spack MCP Server' <<< "$child_help"
        tool_python="$tool_dir/clio-kit/bin/python"
        test -x "$tool_python"
        spack_environment="$("$tool_python" - <<'PY'
        from clio_kit import (
            LOCKED_SERVER_LAUNCH_SCHEMA,
            get_servers_path,
            locked_server_environment,
            locked_server_project_identity,
        )

        server = get_servers_path() / "spack"
        identity = locked_server_project_identity(server)
        environment = locked_server_environment(server)
        assert identity["schema_version"] == LOCKED_SERVER_LAUNCH_SCHEMA
        assert len(identity["project_sha256"]) == 64
        assert len(identity["lock_sha256"]) == 64
        assert environment.name == f"spack-{identity['project_sha256'][:24]}"
        print(environment)
        PY
        )"
        test -x "$spack_environment/bin/python"
        first_child_identity="$(python - "$spack_environment/bin/python" <<'PY'
        import os
        import sys

        status = os.stat(sys.argv[1])
        print(f"{status.st_dev}:{status.st_ino}")
        PY
        )"
        reused_child_help="$("$clio_kit" mcp-server spack -- --help)"
        grep -Fq 'Spack MCP Server' <<< "$reused_child_help"
        reused_spack_environment="$("$tool_python" -c \
          'from clio_kit import get_servers_path,locked_server_environment; print(locked_server_environment(get_servers_path() / "spack"))')"
        test "$reused_spack_environment" = "$spack_environment"
        second_child_identity="$(python - "$spack_environment/bin/python" <<'PY'
        import os
        import sys

        status = os.stat(sys.argv[1])
        print(f"{status.st_dev}:{status.st_ino}")
        PY
        )"
        test "$second_child_identity" = "$first_child_identity"
        jarvis_help="$("$clio_kit" mcp-server jarvis -- --help)"
        grep -Fq 'Jarvis MCP Server' <<< "$jarvis_help"
        jarvis_environment="$("$tool_python" - <<'PY'
        import tomllib

        from clio_kit import get_servers_path, locked_server_environment

        expected_url = "https://github.com/grc-iit/jarvis-cd/releases/download/v1.2.2/jarvis_cd-1.2.2-py3-none-any.whl"
        expected_digest = "f05454718a4efe4dadebefb98c83511ba3dcc662238c0c05430a1b621a8ab8b7"
        expected_requirement = f"jarvis-cd @ {expected_url}#sha256={expected_digest}"
        server = get_servers_path() / "jarvis"
        project = tomllib.loads(
            (server / "pyproject.toml").read_text(encoding="utf-8")
        )
        assert expected_requirement in project["project"]["dependencies"]
        jarvis_lock = tomllib.loads((server / "uv.lock").read_text(encoding="utf-8"))
        jarvis_package = next(
            package
            for package in jarvis_lock["package"]
            if package["name"] == "jarvis-cd"
        )
        assert jarvis_package["version"] == "1.2.2"
        assert jarvis_package["source"] == {"url": expected_url}
        assert jarvis_package["wheels"] == [
            {"url": expected_url, "hash": f"sha256:{expected_digest}"}
        ]
        print(locked_server_environment(server))
        PY
        )"
        test -x "$jarvis_environment/bin/python"
        "$jarvis_environment/bin/python" - <<'PY'
        import inspect
        import json
        import sys
        from importlib.metadata import distribution
        from pathlib import Path

        from jarvis_cd.core.pipeline import Pipeline

        expected_url = "https://github.com/grc-iit/jarvis-cd/releases/download/v1.2.2/jarvis_cd-1.2.2-py3-none-any.whl"
        installed = distribution("jarvis-cd")
        assert installed.version == "1.2.2"
        direct_url_text = installed.read_text("direct_url.json")
        assert direct_url_text is not None
        direct_url = json.loads(direct_url_text)
        assert direct_url["url"] == expected_url
        pipeline_source = Path(inspect.getfile(Pipeline)).resolve()
        assert pipeline_source.is_relative_to(Path(sys.prefix).resolve())
        assert callable(getattr(Pipeline, "get_execution_artifacts", None))
        PY
        jarvis_admin_help="$("$clio_kit" \
          mcp-server jarvis -- --profile admin --help)"
        grep -Fq 'Jarvis MCP Server' <<< "$jarvis_admin_help"
        slurm_help="$("$clio_kit" mcp-server slurm -- --help)"
        grep -Fq 'Slurm MCP Server' <<< "$slurm_help"

    - name: Attest release distributions
      if: steps.version.outputs.is_release == 'true'
      uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
      with:
        subject-path: |
          dist/*.whl
          dist/*.tar.gz
    
    - name: Store the distribution packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: python-package-distributions
        path: |
          dist/*.whl
          dist/*.tar.gz
        if-no-files-found: error
        include-hidden-files: false

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # Only publish on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clio-kit
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Require fresh exact admin authorization at publication
      env:
        RELEASE_AUTHORIZATION: ${{ secrets.CLIO_KIT_RELEASE_AUTHORIZATION }}
        REPOSITORY: ${{ github.repository }}
        TAG_NAME: ${{ github.ref_name }}
      shell: bash
      run: |
        printf '%s\n' "$RELEASE_AUTHORIZATION" | \
          python scripts/release_authorization.py \
            --repository "$REPOSITORY" \
            --tag "$TAG_NAME" \
            --commit "$GITHUB_SHA" \
            --max-age-seconds 3600 >/dev/null

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
      with:
        skip-existing: true
        verbose: true

    - name: Verify exact published PyPI bytes
      env:
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
      run: |
        python scripts/verify_pypi_release.py \
          --project clio-kit \
          --version "$RELEASE_VERSION" \
          --dist-dir dist

  github-release:
    name: Create GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # Mandatory for creating releases
      attestations: read

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Verify and publish immutable GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        TAG_NAME: ${{ github.ref_name }}
      shell: bash
      run: |
        resolve_remote_tag() {
          local sha type
          read -r sha type < <(
            gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" \
              --jq '[.object.sha, .object.type] | @tsv'
          )
          while [ "$type" = "tag" ]; do
            read -r sha type < <(
              gh api "repos/$REPOSITORY/git/tags/$sha" \
                --jq '[.object.sha, .object.type] | @tsv'
            )
          done
          test "$type" = "commit"
          printf '%s\n' "$sha"
        }
        test "$(resolve_remote_tag)" = "$GITHUB_SHA"

        mapfile -t artifacts < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
        test "${#artifacts[@]}" -eq 2
        declare -A expected_sha=()
        for name in "${artifacts[@]}"; do
          [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          [[ "$name" = *.whl || "$name" = *.tar.gz ]]
          expected_sha["$name"]="$(sha256sum "dist/$name" | cut -d' ' -f1)"
        done

        for subject in dist/*.whl dist/*.tar.gz; do
          gh attestation verify "$subject" \
            --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/publish.yml" \
            --source-ref "refs/tags/$TAG_NAME" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
        done

        release_tmp="$(mktemp -d)"
        trap 'rm -rf "$release_tmp"' EXIT
        release_json="$release_tmp/release.json"
        release_error="$release_tmp/release.error"

        fetch_release() {
          gh api "repos/$REPOSITORY/releases/tags/$TAG_NAME" >"$release_json"
          test "$(jq -r .tag_name "$release_json")" = "$TAG_NAME"
        }

        load_and_verify_assets() {
          local allow_missing="$1" id name declared_digest downloaded
          declare -gA asset_ids=()
          while IFS=$'\t' read -r id name declared_digest; do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
            if [[ ! -v "expected_sha[$name]" ]]; then
              echo "unexpected release asset: $name" >&2
              return 1
            fi
            if [[ -v "asset_ids[$name]" ]]; then
              echo "duplicate release asset: $name" >&2
              return 1
            fi
            if [ -n "$declared_digest" ] && \
               [ "$declared_digest" != "sha256:${expected_sha[$name]}" ]; then
              echo "release asset digest mismatch: $name" >&2
              return 1
            fi
            asset_ids["$name"]="$id"
          done < <(
            jq -r '.assets[] | [.id, .name, (.digest // "")] | @tsv' \
              "$release_json"
          )

          for name in "${artifacts[@]}"; do
            if [[ ! -v "asset_ids[$name]" ]]; then
              if [ "$allow_missing" = true ]; then
                gh release upload "$TAG_NAME" "dist/$name" --repo "$REPOSITORY"
                continue
              fi
              echo "missing release asset: $name" >&2
              return 1
            fi
            downloaded="$release_tmp/download-$name"
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$REPOSITORY/releases/assets/${asset_ids[$name]}" \
              >"$downloaded"
            cmp --silent "dist/$name" "$downloaded"
          done
        }

        if fetch_release 2>"$release_error"; then
          :
        elif grep -Fq 'HTTP 404' "$release_error"; then
          gh release create "$TAG_NAME" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "CLIO Kit $TAG_NAME" \
            --generate-notes \
            --draft
          fetch_release
        else
          cat "$release_error" >&2
          exit 1
        fi

        draft="$(jq -r .draft "$release_json")"
        immutable="$(jq -r .immutable "$release_json")"
        if [ "$draft" = true ]; then
          test "$immutable" = false
          load_and_verify_assets true
          fetch_release
          load_and_verify_assets false
          test "$(resolve_remote_tag)" = "$GITHUB_SHA"
          gh release edit "$TAG_NAME" --repo "$REPOSITORY" --draft=false
        else
          test "$immutable" = true
          load_and_verify_assets false
        fi

        test "$(resolve_remote_tag)" = "$GITHUB_SHA"
        fetch_release
        test "$(jq -r .draft "$release_json")" = false
        test "$(jq -r .immutable "$release_json")" = true
        load_and_verify_assets false
        verified=false
        for attempt in {1..12}; do
          if gh release verify "$TAG_NAME" --repo "$REPOSITORY"; then
            verified=true
            break
          fi
          echo "release attestation not ready (attempt $attempt/12)" >&2
          sleep 5
        done
        test "$verified" = true

  publish-to-mcp-registry:
    name: Publish to MCP Registry
    needs:
    - github-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write  # GitHub OIDC for registry authentication

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Install mcp-publisher
      shell: bash
      run: |
        MCP_PUBLISHER_VERSION=1.7.9
        MCP_PUBLISHER_SHA256=ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        archive=mcp-publisher_linux_amd64.tar.gz
        curl --fail --location --retry 3 \
          --output "$archive" \
          "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
        echo "$MCP_PUBLISHER_SHA256 *$archive" | sha256sum --check --strict -
        tar -xzf "$archive" mcp-publisher
        ./mcp-publisher --version

    - name: Authenticate with GitHub OIDC
      run: ./mcp-publisher login github-oidc

    - name: Publish versioned servers to MCP registry
      run: |
        FAILURES=0
        PUBLISHED=0
        SKIPPED=0
        mapfile -t release_servers < <(python3 - <<'PY'
        import tomllib
        from pathlib import Path

        data = tomllib.loads(
            Path("mcp-server-versions.toml").read_text(encoding="utf-8")
        )
        for server in data["mcp-registry-release"]["publish"]:
            print(server)
        PY
        )
        test "${#release_servers[@]}" -gt 0
        for server_name in "${release_servers[@]}"; do
          server_dir="clio-kit-mcp-servers/$server_name"
          test -f "$server_dir/server.json"
          echo "Publishing $server_name to MCP registry..."
          if OUTPUT=$(cd "$server_dir" && ../../mcp-publisher publish 2>&1); then
            publish_result=published
          elif echo "$OUTPUT" | grep -qi \
            "duplicate version\|already published\|already exists"; then
            publish_result=duplicate
          else
            echo "::error::Failed to publish $server_name to MCP registry"
            echo "$OUTPUT"
            FAILURES=$((FAILURES + 1))
            continue
          fi

          if python3 scripts/verify_mcp_registry_release.py \
            --manifest "$server_dir/server.json" \
            --attempts 12 \
            --retry-delay 5; then
            if [ "$publish_result" = published ]; then
              echo "Published and verified $server_name"
              PUBLISHED=$((PUBLISHED + 1))
            else
              echo "Verified exact existing version for $server_name"
              SKIPPED=$((SKIPPED + 1))
            fi
          else
            echo "::error::Registry state does not exactly match $server_name"
            echo "$OUTPUT"
            FAILURES=$((FAILURES + 1))
          fi
        done
        echo "MCP Registry: $PUBLISHED published, $SKIPPED already existed, $FAILURES failed"
        if [ $FAILURES -gt 0 ]; then
          echo "::error::$FAILURES server(s) failed to publish to MCP registry"
          exit 1
        fi

  # NOTE: Smithery deprecated stdio transport (Sep 2025) and now only supports
  # hosted HTTP servers. All clio-kit servers require local access (file system,
  # HPC scheduler, hardware) so Smithery hosting is not viable. Servers are
  # discoverable via MCP Registry (modelcontextprotocol.io) and PyPI instead.
  # Re-enable this job if Smithery adds stdio support or if we add HTTP hosting.
