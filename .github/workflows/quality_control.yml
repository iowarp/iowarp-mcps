name: Quality Control

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Chronolog MCP tests are handled in dedicated workflow

jobs:
  discover-mcps:
    name: Discover MCP Directories
    runs-on: ubuntu-latest
    outputs:
      mcps: ${{ steps.discover.outputs.mcps }}
      any_mcp_changed: ${{ steps.discover.outputs.any_mcp_changed }}
      containment_changed: ${{ steps.discover.outputs.containment_changed }}
      search_changed: ${{ steps.discover.outputs.search_changed }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0  # Need full history for diff

    - name: Discover changed MCPs
      id: discover
      run: |
        # ── Build list of all MCP directories (excluding Chronolog) ──
        blacklisted_mcps="chronolog|Chronolog"
        all_mcps=$(find clio-kit-mcp-servers -maxdepth 1 -type d -exec test -f {}/pyproject.toml \; -print \
          | sed 's|clio-kit-mcp-servers/||' | grep -v -E "^($blacklisted_mcps)$" | sort)

        # ── Detect changed files ──
        RUN_ALL=false
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
        elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
        else
          # workflow_dispatch, initial branch push, or no valid base — test everything
          RUN_ALL=true
          CHANGED=""
        fi

        echo "Changed files:"
        echo "$CHANGED"

        # ── Check for infrastructure changes (triggers full run) ──
        if [ "$RUN_ALL" = "false" ] && echo "$CHANGED" | grep -qE '^(scripts/|\.github/|\.codecov\.yml$|pyproject\.toml$|uv\.lock$|mcp-server-versions\.toml$|clio-agentic-search/uv\.lock$)'; then
          RUN_ALL=true
        fi
        echo "Run all: $RUN_ALL"

        # ── Determine which MCPs to test ──
        if [ "$RUN_ALL" = "true" ]; then
          mcps_list="$all_mcps"
        else
          mcps_list=""
          for mcp in $all_mcps; do
            if echo "$CHANGED" | grep -q "^clio-kit-mcp-servers/$mcp/"; then
              mcps_list="${mcps_list:+$mcps_list$'\n'}$mcp"
            fi
          done
        fi

        # ── Output MCPs as JSON array ──
        if [ -z "$mcps_list" ]; then
          echo "mcps=[]" >> $GITHUB_OUTPUT
          echo "any_mcp_changed=false" >> $GITHUB_OUTPUT
        else
          mcps=$(echo "$mcps_list" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "mcps=$mcps" >> $GITHUB_OUTPUT
          echo "any_mcp_changed=true" >> $GITHUB_OUTPUT
        fi
        echo "MCPs to test: $(cat $GITHUB_OUTPUT | grep mcps=)"

        # Windows Job Object ownership is shared by the JARVIS and Spack
        # execution boundaries. Exercise both implementations whenever either
        # server is in the discovered change set.
        if echo "$mcps_list" | grep -qE '^(jarvis|spack)$'; then
          echo "containment_changed=true" >> $GITHUB_OUTPUT
        else
          echo "containment_changed=false" >> $GITHUB_OUTPUT
        fi

        # ── Determine if agentic-search needs testing ──
        if [ "$RUN_ALL" = "true" ] || echo "$CHANGED" | grep -q "^clio-agentic-search/"; then
          echo "search_changed=true" >> $GITHUB_OUTPUT
        else
          echo "search_changed=false" >> $GITHUB_OUTPUT
        fi

  ruff:
    name: Ruff - ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.any_mcp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.discover-mcps.outputs.mcps) }}
      max-parallel: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: 'recursive'

    - uses: ./.github/actions/setup-mcp
      with:
        mcp: ${{ matrix.mcp }}
        dev-packages: ruff

    - name: Run Ruff linter on ${{ matrix.mcp }}
      run: |
        cd clio-kit-mcp-servers/${{ matrix.mcp }}
        uv run ruff check --output-format=github .

    - name: Run Ruff formatter check on ${{ matrix.mcp }}
      run: |
        cd clio-kit-mcp-servers/${{ matrix.mcp }}
        uv run ruff format --check .

  mypy:
    name: MyPy - ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.any_mcp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.discover-mcps.outputs.mcps) }}
      max-parallel: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: 'recursive'

    - uses: ./.github/actions/setup-mcp
      with:
        mcp: ${{ matrix.mcp }}
        dev-packages: mypy

    - name: Run MyPy on ${{ matrix.mcp }}
      run: |
        cd clio-kit-mcp-servers/${{ matrix.mcp }}
        if [ -d src ]; then
          uv run mypy src/ --ignore-missing-imports --show-error-codes --no-error-summary
        else
          echo "No src directory found for ${{ matrix.mcp }}"
        fi

  test:
    name: Test - ${{ matrix.mcp }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.any_mcp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        mcp: ${{ fromJson(needs.discover-mcps.outputs.mcps) }}
        exclude:
          - mcp: jarvis
            python-version: "3.10"
      max-parallel: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: 'recursive'

    - uses: ./.github/actions/setup-mcp
      with:
        python-version: ${{ matrix.python-version }}
        mcp: ${{ matrix.mcp }}
        dev-packages: "pytest pytest-cov"

    - name: Run tests for ${{ matrix.mcp }}
      run: |
        cd clio-kit-mcp-servers/${{ matrix.mcp }}
        if [ -d tests ]; then
          uv run pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=html --cov-report=term \
            --junitxml=junit.xml -o junit_family=legacy
          python ../../scripts/assert_no_skipped_tests.py junit.xml
        else
          echo "No tests directory found for ${{ matrix.mcp }}"
        fi

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        file: clio-kit-mcp-servers/${{ matrix.mcp }}/coverage.xml
        flags: ${{ matrix.mcp }}
        name: codecov-${{ matrix.mcp }}
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: matrix.python-version == '3.12' && !cancelled()
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
      with:
        file: clio-kit-mcp-servers/${{ matrix.mcp }}/junit.xml
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage HTML report
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-html-${{ matrix.mcp }}
        path: clio-kit-mcp-servers/${{ matrix.mcp }}/htmlcov/
        if-no-files-found: ignore

  windows-containment:
    name: Windows containment - ${{ matrix.mcp }}
    runs-on: windows-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.containment_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        mcp: [jarvis, spack]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: 'recursive'

    - uses: ./.github/actions/setup-mcp
      with:
        python-version: '3.12'
        mcp: ${{ matrix.mcp }}
        dev-packages: "pytest pytest-cov"

    - name: Run real Windows process-containment tests for ${{ matrix.mcp }}
      shell: pwsh
      run: |
        uv run --directory "clio-kit-mcp-servers/${{ matrix.mcp }}" `
          python -c "import os; assert os.name == 'nt', os.name"
        uv run --directory "clio-kit-mcp-servers/${{ matrix.mcp }}" `
          pytest tests/ -v --tb=short `
          --cov=src --cov-report=xml --cov-report=html --cov-report=term `
          --junitxml=junit-windows.xml -o junit_family=legacy
        python scripts/assert_no_skipped_tests.py `
          "clio-kit-mcp-servers/${{ matrix.mcp }}/junit-windows.xml"

    - name: Upload Windows coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        file: clio-kit-mcp-servers/${{ matrix.mcp }}/coverage.xml
        flags: ${{ matrix.mcp }}
        name: codecov-${{ matrix.mcp }}-windows
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload Windows containment evidence
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: windows-containment-${{ matrix.mcp }}-evidence
        path: |
          clio-kit-mcp-servers/${{ matrix.mcp }}/coverage.xml
          clio-kit-mcp-servers/${{ matrix.mcp }}/htmlcov/
          clio-kit-mcp-servers/${{ matrix.mcp }}/junit-windows.xml
        if-no-files-found: warn

  security:
    name: Security Audit - ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.any_mcp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.discover-mcps.outputs.mcps) }}
      max-parallel: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: 'recursive'

    - uses: ./.github/actions/setup-mcp
      with:
        mcp: ${{ matrix.mcp }}
        dev-packages: pip-audit

    - name: Run security audit for ${{ matrix.mcp }}
      run: |
        cd clio-kit-mcp-servers/${{ matrix.mcp }}
        uv run pip-audit

  validate-fastmcp:
    name: Validate FastMCP - ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.any_mcp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.discover-mcps.outputs.mcps) }}
      max-parallel: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: 'recursive'

    - uses: ./.github/actions/setup-mcp
      with:
        mcp: ${{ matrix.mcp }}

    - name: Validate FastMCP 3.0 compliance for ${{ matrix.mcp }}
      run: |
        cd clio-kit-mcp-servers/${{ matrix.mcp }}
        uv run python ../../scripts/validate_fastmcp.py

  validate-server-json:
    name: Validate server.json - ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.any_mcp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.discover-mcps.outputs.mcps) }}
      max-parallel: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: 'recursive'

    - uses: ./.github/actions/setup-mcp
      with:
        mcp: ${{ matrix.mcp }}

    - name: Regenerate and diff server.json for ${{ matrix.mcp }}
      run: |
        cd clio-kit-mcp-servers/${{ matrix.mcp }}
        # Extract live metadata
        LIVE=$(uv run python ../../scripts/extract_mcp_metadata.py)

        # Compare tool/resource/prompt counts from live metadata vs committed server.json
        if [ ! -f server.json ]; then
          echo "FAIL: server.json not found for ${{ matrix.mcp }}"
          exit 1
        fi

        # Validate JSON is well-formed
        python3 -c "import json, sys; json.load(open('server.json'))" || {
          echo "FAIL: server.json is not valid JSON"
          exit 1
        }

        # Verify tool names match between live metadata and server.json
        LIVE_TOOLS=$(echo "$LIVE" | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(sorted(t['name'] for t in d.get('tools',[]))))")
        JSON_TOOLS=$(python3 -c "import json; d=json.load(open('server.json')); print('\n'.join(sorted(t['name'] for t in d.get('tools',[]))))")

        if [ "$LIVE_TOOLS" != "$JSON_TOOLS" ]; then
          echo "FAIL: server.json tools out of sync with live metadata"
          echo "--- Live tools ---"
          echo "$LIVE_TOOLS"
          echo "--- server.json tools ---"
          echo "$JSON_TOOLS"
          exit 1
        fi

        echo "PASS: server.json is in sync for ${{ matrix.mcp }}"

  # ── clio-agentic-search (standalone service, not an MCP server) ──

  agentic-search-ruff:
    name: Ruff - clio-agentic-search
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.search_changed == 'true'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: "latest"
    - run: uv python install 3.12
    - name: Install dependencies
      run: |
        cd clio-agentic-search
        uv sync --locked --dev
    - name: Ruff lint
      run: |
        cd clio-agentic-search
        uv run ruff check --output-format=github .
    - name: Ruff format check
      run: |
        cd clio-agentic-search
        uv run ruff format --check .

  agentic-search-mypy:
    name: MyPy - clio-agentic-search
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.search_changed == 'true'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: "latest"
    - run: uv python install 3.12
    - name: Install dependencies
      run: |
        cd clio-agentic-search
        uv lock --check
        uv sync --locked --dev
    - name: Run MyPy
      run: |
        cd clio-agentic-search
        uv run mypy src/ --ignore-missing-imports --show-error-codes --no-error-summary

  agentic-search-test:
    name: Test - clio-agentic-search (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: discover-mcps
    if: needs.discover-mcps.outputs.search_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: "latest"
    - run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        cd clio-agentic-search
        uv sync --locked --dev
    - name: Run tests
      run: |
        cd clio-agentic-search
        uv run pytest --ignore=tests/benchmarks -v --tb=short \
          --junitxml=junit.xml -o junit_family=legacy
        python ../scripts/assert_no_skipped_tests.py junit.xml
