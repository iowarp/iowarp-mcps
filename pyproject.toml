[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clio-kit"
version = "2.4.8"
description = "CLIO Kit - MCP Servers, Clients, and Tools for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu"}
]

# Only dependencies needed for the launcher
dependencies = [
  "click>=8.3.3",
]

keywords = ["mcp", "model-context-protocol", "ai-agents", "llm-tools", "scientific-computing", "hpc", "hdf5", "slurm", "parquet", "research-tools"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/iowarp/clio-kit"
Repository = "https://github.com/iowarp/clio-kit"
Issues = "https://github.com/iowarp/clio-kit/issues"

[project.scripts]
# Only the unified launcher entry point
clio-kit = "clio_kit:cli"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.3",
  "ruff>=0.12.5",
]

[tool.hatch.build]
# NB: do NOT set a global `sources = ["src"]` — it strips `src/` from the sdist
# (cli lands at `clio_kit/` root), then the wheel-from-sdist build looks under
# `src/clio_kit` and ships a wheel with no cli. The per-target `packages =
# ["src/clio_kit"]` below handles the src-layout correctly for both direct and
# from-sdist builds (this is what `uv build` / CI do).
# Shared-data copies from filesystem, not git — exclude non-runtime artifacts
exclude = [
    "**/.venv",
    "**/.virtualenv-app-data",
    "**/.uv-cache",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.benchmarks",
    "**/.github",
    "**/dist",
    "**/tests",
    "**/.pre-commit-config.yaml",
    "**/.gitignore",
]

# Include every server project for persistent-tool and one-shot execution
[tool.hatch.build.targets.wheel]
packages = ["src/clio_kit"]

[tool.hatch.build.targets.wheel.shared-data]
"clio-kit-mcp-servers" = "clio-kit-mcp-servers"
"clio-agentic-search" = "clio-agentic-search"
"prompts" = "prompts"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "clio-kit-mcp-servers/",
    "clio-agentic-search/",
    "prompts/",
    "README.md",
    "mcp-server-versions.toml",
    "pyproject.toml"
]
