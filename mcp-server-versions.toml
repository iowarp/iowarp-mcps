schema-version = 1

# Publish the JARVIS server under a fresh immutable Registry version so its
# package coordinate resolves the wheel containing the updated JARVIS lock.
[mcp-registry-release]
publish = ["jarvis"]

# Generated website metadata must not depend on the wall clock. Advance this
# date intentionally whenever current contract metadata is regenerated.
[documentation]
updated = "2026-07-18"

# MCP Registry server versions describe each agent-facing contract. They are
# intentionally independent of the clio-kit PyPI distribution version, which
# only identifies the wheel containing the server implementations.
[servers]
adios = "2.2.3"
arxiv = "2.2.3"
chronolog = "2.0.1"
compression = "2.2.3"
darshan = "2.2.3"
geo = "2.2.3"
geojson = "2.2.3"
hdf5 = "2.2.3"
jarvis = "3.5.4"
lmod = "2.2.3"
ndp = "2.2.3"
node-hardware = "2.2.3"
pandas = "2.2.3"
parallel-sort = "2.2.3"
paraview = "2.2.3"
parquet = "2.2.3"
plot = "2.2.3"
sac = "2.2.3"
scientific-catalog = "1.1.2"
seismic = "2.2.3"
slurm = "3.0.0"
spack = "2.1.0"
terrain = "2.2.3"
