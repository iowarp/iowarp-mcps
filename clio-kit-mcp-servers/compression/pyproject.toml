[project]
name = "compression-mcp"
version = "1.0.0"
description = "Compression MCP server implementation using Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["compression", "gzip", "storage", "archival", "backup", "analytics", "statistics"]

dependencies = [
    "fastmcp>=3.0.1",
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
compression-mcp = "compression_mcp.server:main"

[dependency-groups]
dev = [
     "mypy>=1.17.0",
     "pip-audit>=2.10.0",
     "pytest>=8.3.5",
     "pytest-asyncio>=1.0.0",
     "pytest-cov>=6.2.1",
     "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compression_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
