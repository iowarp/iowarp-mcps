[project]
name = "parallel-sort-mcp"
version = "1.0.0"
description = "Parallel Sort MCP - High-Performance Log File Processing for LLMs with advanced sorting and analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["parallel-sorting", "log-processing", "log-analysis", "high-performance", "timestamp-sorting", "pattern-detection", "log-filtering", "data-export"]

dependencies = [
  "fastmcp>=3.2.0",
  "python-dotenv>=1.2.2",
  "pandas>=1.5.0",
  "aiofiles>=23.0.0",
  "authlib>=1.6.12",
  "cryptography>=48.0.1",
  "idna>=3.15",
  "pydantic-settings>=2.14.2",
  "pygments>=2.20.0",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.31",
  "starlette>=1.3.1",
  "urllib3>=2.7.0",
  "msgpack>=1.2.1",
  "requests>=2.33.0",
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
parallel-sort-mcp = "parallel_sort_mcp.server:main"

[dependency-groups]
dev = [
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.12.5",
    "types-aiofiles>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_sort_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
