[project]
name = "jarvis-mcp"
version = "3.5.2"
description = "JARVIS-CD MCP with a compact user pipeline contract and explicit admin compatibility profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["jarvis", "pipeline-management", "high-performance-computing", "hpc", "workflow", "data-pipelines", "scientific-computing", "mcp", "package-management"]

dependencies = [
  "fastmcp>=3.2.0",
  "fastapi",
  "python-dotenv>=1.2.2",
  "jarvis-cd @ https://github.com/grc-iit/jarvis-cd/releases/download/v1.4.3/jarvis_cd-1.4.3-py3-none-any.whl#sha256=7944f256e2442a3355775c9a54ebb44b5a9b26394e4aa4aeb85a0268d238bac2",
  "starlette>=1.3.1",
  "authlib>=1.6.12",
  "cryptography>=48.0.1",
  "idna>=3.15",
  "pydantic-settings>=2.14.2",
  "pydantic>=2.12.5",
  "pygments>=2.20.0",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.31",
  "urllib3>=2.7.0",
  "typing-extensions>=4.15.0",
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
jarvis-mcp = "jarvis_mcp.server:main"
jarvis-admin-mcp = "jarvis_mcp.admin_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.5",
    "psutil>=6.0.0",
    "mypy>=1.17.0",
    "types-requests",
    "pip-audit>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: integration tests that may exercise multiple components",
  "performance: performance-oriented tests",
]
