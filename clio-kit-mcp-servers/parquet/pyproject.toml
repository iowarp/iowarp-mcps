[project]
name = "parquet-mcp"
version = "1.0.0"
description = "MCP server for Apache Parquet files"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["parquet", "columnar-data", "data-analysis", "scientific-computing", "mcp", "llm-integration", "apache-arrow"]

dependencies = [
    "authlib>=1.6.12",
    "cryptography>=48.0.1",
    "fastmcp>=3.2.0",
    "idna>=3.15",
    "msgpack>=1.2.1",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[dependency-groups]
dev = [
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.5",
]

[project.scripts]
parquet-mcp = "parquet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parquet_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
