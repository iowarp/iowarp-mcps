[project]
name = "arxiv-mcp"
version = "1.0.0"
description = "ArXiv MCP server implementation using Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["data processing", "arxiv", "publications", "scientific data", "research", "papers", "iowarp", "grc"]

dependencies = [
    "authlib>=1.6.12",
    "cryptography>=48.0.1",
    "fastmcp>=4.0.0b1",
    "httpx>=0.24.0",
    "idna>=3.15",
    "msgpack>=1.2.1",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
arxiv-mcp = "arxiv_mcp.server:main"

[dependency-groups]
dev = [
     "mypy>=1.17.0",
     "pip>=26.1.2",
     "pip-audit>=2.10.0",
     "pytest>=9.0.3",
     "pytest-asyncio>=1.0.0",
     "pytest-cov>=6.2.1",
     "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
