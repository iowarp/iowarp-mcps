[project]
name = "web-mcp"
version = "2.1.0"
description = "Provider-fixed web search plus transparent URL, DOI, and document fetching"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["web", "fetch", "search", "mcp", "llm-integration", "agentic-web"]

dependencies = [
    "fastmcp[tasks]>=4.0.0b3,<5",
    "httpx>=0.27.0",
    "trafilatura>=1.12",
    "readability-lxml>=0.8",
    "ddgs>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
web-mcp = "web_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.12.5",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "ICN", "PIE", "T20", "Q"]
ignore = ["S101", "S104", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["trafilatura", "readability", "ddgs"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"
markers = [
    "integration: marks tests that hit the real network (deselect with '-m \"not integration\"')",
]

[tool.uv]
prerelease = "allow"
