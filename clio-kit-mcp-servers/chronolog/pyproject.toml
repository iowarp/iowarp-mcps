[project]
name = "chronolog-mcp"
version = "1.0.0"
description = "ChronoLog MCP server implementation using Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = [ "distributed logging",
    "chronolog",
    "event logging",
    "session management",
    "context sharing",
    "real-time",
    "model context protocol",
    "scientific data",
    "conversational ai",
    "high-performance",
    "shared log",
    "multi-client",
    "historical retrieval",
    "enterprise logging"
    ]

dependencies = [
    "fastmcp>=3.2.0",
    "python-dotenv>=1.2.2",
    "google-genai",
    "h5py",
    "pytest>=9.0.3",
    "pytest-asyncio",
    "h11>=0.16.0",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0"
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
chronolog-mcp = "chronomcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronomcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
