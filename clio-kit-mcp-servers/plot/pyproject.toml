[project]
name = "plot-mcp"
version = "1.0.0"
description = "MCP server for advanced data visualization and plotting operations"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["MCP", "plotting", "visualization", "analytics", "matplotlib", "seaborn", "data-science"]

dependencies = [
    "fastmcp>=3.0.1",
    "python-dotenv>=1.0.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "numpy<2.0.0",
    "openpyxl>=3.0.0",
    "pydantic>=2.4.2"
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
plot-mcp = "plot_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plot_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
