[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spack-mcp"
version = "1.0.0"
description = "Structured Spack discovery and installation tools for scientific agents"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" },
]
dependencies = [
  "fastmcp>=4.0.0b1",
  "fastmcp-slim[server]>=4.0.0b1",
  "pydantic>=2.10",
]

[project.scripts]
spack-mcp = "spack_mcp.server:main"
spack-admin-mcp = "spack_mcp.admin_server:main"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pip-audit>=2.10.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spack_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
