[project]
name = "hdf5-mcp"
version = "1.0.0"
description = "HDF5 FastMCP - Scientific Data Access for AI Agents | CLIO Kit MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["hdf5", "scientific-data", "hierarchical-data", "data-analysis", "scientific-computing", "mcp", "llm-integration", "data-structures"]

dependencies = [
  "fastmcp>=4.0.0b1",
  "h5py>=3.15.0",
  "numpy>=2.0.0",
  "pydantic>=2.4.2,<3.0.0",
  "psutil>=5.9.0",
  "python-dotenv>=1.2.2",
  "authlib>=1.6.12",
  "cryptography>=48.0.1",
  "idna>=3.15",
  "pydantic-settings>=2.14.2",
  "pygments>=2.20.0",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.31",
  "starlette>=1.3.1",
  "urllib3>=2.7.0",
  "msgpack>=1.2.1",
  "requests>=2.33.0",
]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.12.5",
]

[project.scripts]
hdf5-mcp = "hdf5_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hdf5_mcp"]

[tool.coverage.run]
omit = [
    # Exclude server.py from coverage - it's a FastMCP glue layer
    # that initializes global ThreadPoolExecutor causing test hangs.
    # All business logic is tested in: config.py (100%), resources.py (96%), utils.py (98%)
    "src/hdf5_mcp/server.py",
    "*/tests/*",
]

[tool.coverage.report]
# Target 90%+ coverage on implementation modules (config, resources, utils)
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
