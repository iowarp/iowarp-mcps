[project]
name = "terrain-mcp"
version = "1.0.0"
description = "MCP server for terrain analysis: DEM slope/aspect/suitability and point-cloud reading/gridding"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["MCP", "terrain", "dem", "slope", "aspect", "point-cloud", "geospatial", "numpy"]

dependencies = [
    "fastmcp>=3.0.1",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
geotiff = ["rasterio>=1.3.0"]
laz = ["laspy>=2.5.0"]

[project.urls]
Homepage = "https://docs.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
terrain-mcp = "terrain_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrain_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
